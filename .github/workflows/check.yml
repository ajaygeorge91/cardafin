# `offline` installs nothing: the test suite and the dev console are meant to
# run from a clean clone with no node_modules, and this is where that is
# checked rather than asserted. `typecheck` is separate because typescript is
# a devDependency, so it is the one job that needs the registry.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: tests and console, nothing installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: no node_modules is present
        run: test ! -d node_modules

      - name: tests
        run: npm test

      - name: console surface
        run: npm run console:probe

      - name: port contracts match the manifest
        run: node scripts/freeze-ports.mjs --check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
